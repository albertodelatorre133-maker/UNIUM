<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="UNIUM Wellness Training — Unidos somos más fuertes">
  <defs>
    <linearGradient id="oro" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#fbf0bf"/>
      <stop offset="38%" stop-color="#e3c358"/>
      <stop offset="70%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8b6e1e"/>
    </linearGradient>
    <filter id="halo" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Halo más contenido para el monograma, que va cerca del texto -->
    <filter id="haloSuave" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#000000"/>
  <circle cx="512" cy="512" r="400" fill="none" stroke="#f6d976" stroke-width="7" filter="url(#halo)" opacity="0.95"/>

  <!-- Monograma U + W con la figura humana -->
  <g filter="url(#haloSuave)">
    <g fill="none" stroke="url(#oro)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M366 240 V390 a76 76 0 0 0 152 0 V240" stroke-width="36"/>
      <path d="M462 240 L514 452 L558 334 L602 452 L656 240" stroke-width="30"/>
      <path d="M430 300 Q508 230 586 300" stroke-width="18"/>
    </g>
    <circle cx="508" cy="228" r="24" fill="url(#oro)"/>
  </g>

  <!--
    textLength + lengthAdjust fijan el ancho de cada línea: aunque el visor no
    tenga la tipografía de la marca, las letras conservan su posición.
  -->
  <text x="512" y="602" text-anchor="middle" textLength="566" lengthAdjust="spacing"
        fill="url(#oro)" font-family="'Archivo Narrow','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="116" font-weight="500">UNIUM</text>

  <g fill="#d4af37" opacity="0.85">
    <rect x="166" y="661" width="74" height="3"/>
    <rect x="784" y="661" width="74" height="3"/>
  </g>
  <text x="512" y="674" text-anchor="middle" textLength="502" lengthAdjust="spacing"
        fill="#e0bd5a" font-family="'Hanken Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="41">WELLNESS TRAINING</text>

  <text x="512" y="742" text-anchor="middle" textLength="546" lengthAdjust="spacing"
        fill="#c9a94a" opacity="0.9" font-family="'Hanken Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="33">UNIDOS SOMOS MÁS FUERTES</text>

  <g transform="translate(512 814)" fill="#d4af37">
    <rect x="-59" y="-11" width="10" height="22" rx="3"/>
    <rect x="-45" y="-18" width="13" height="36" rx="4"/>
    <rect x="-27" y="-5" width="54" height="10" rx="4"/>
    <rect x="32" y="-18" width="13" height="36" rx="4"/>
    <rect x="49" y="-11" width="10" height="22" rx="3"/>
  </g>
</svg>
